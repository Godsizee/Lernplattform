version: '3.8'

services:
  web:
    build: .
    container_name: code_cash_web
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST:-172.28.0.2}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    networks:
      - npm_net

networks:
  npm_net:
    name: nginx-proxy-manager_default
    external: true
