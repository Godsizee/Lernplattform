<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code & Cash | Lernplattform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="app" class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="assets/img/logo_alt.png" alt="Code & Cash Logo" class="brand-logo-img">
                <h2>Code <span class="brand-accent">&</span> Cash</h2>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-route="dashboard">
                    <i class="ph ph-squares-four"></i> <span class="nav-text">Dashboard</span>
                </a>
                <a href="#learning" class="nav-item" data-route="learning">
                    <i class="ph ph-books"></i> <span class="nav-text">Lern-Bereich</span>
                </a>
                <a href="#profile" class="nav-item" data-route="profile">
                    <i class="ph ph-user-circle"></i> <span class="nav-text">Mein Profil</span>
                </a>
                <a href="#admin" class="nav-item" data-route="admin" style="display:none;" id="admin-nav-item">
                    <i class="ph ph-shield-star"></i> <span class="nav-text">Admin-Bereich</span>
                </a>
            </nav>
            <div style="margin-top: auto;">
                <button id="theme-toggle-btn" class="nav-item" style="width:100%; background:none; border:none; text-align:left; cursor:pointer; padding-top: 0.8rem; padding-bottom: 0.8rem;">
                    <i class="ph ph-moon" id="theme-icon"></i> <span class="nav-text" id="theme-text">Dark Mode</span>
                </button>
                <a href="#privacy" class="nav-item" data-route="privacy" style="margin-bottom:1rem; padding-top: 0.8rem; padding-bottom: 0.8rem;">
                    <i class="ph ph-shield-check"></i> <span class="nav-text">Datenschutz</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">
                        <i class="ph-fill ph-user"></i>
                    </div>
                    <div class="user-info">
                        <span class="user-name">Umschüler (WIF)</span>
                        <span class="user-role">Student</span>
                    </div>
                </div>
                <button id="logout-btn" class="icon-btn" title="Logout">
                    <i class="ph ph-sign-out"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left" style="display: flex; align-items: center; gap: 1rem;">
                    <button id="sidebar-toggle" title="Sidebar einklappen/ausklappen" style="background: none; border: none; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0.5rem; border-radius: var(--radius-sm); transition: background 0.2s;">
                        <i class="ph ph-list" style="font-size: 1.5rem;"></i>
                    </button>
                    <div class="streak-badge" title="Lern-Streak">
                        <i class="ph-fill ph-fire"></i>
                        <span id="streak-counter">12 Tage Streak!</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="global-progress">
                        <div class="progress-info">
                            <span>Gesamtfortschritt</span>
                            <strong id="global-progress-text">45%</strong>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="global-progress-bar" style="width: 45%;"></div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <div id="view-container" class="view-container">
                <!-- Content injected via JS -->
            </div>
        </main>
    </div>

    <!-- TEMPLATES -->

    <!-- Auth Template -->
    <template id="tpl-auth">
        <div class="auth-wrapper fade-in">
            <div class="auth-card">
                <div class="auth-header">
                    <img src="assets/img/logo.png" alt="Code & Cash Logo" class="auth-logo-img" style="max-height: 80px; margin-bottom: 1rem;">
                    <h2>Code <span class="brand-accent">&</span> Cash</h2>
                    <p id="auth-subtitle">Willkommen zurück!</p>
                </div>
                
                <div class="auth-tabs">
                    <button class="auth-tab active" data-target="login">Login</button>
                    <button class="auth-tab" data-target="register">Registrieren</button>
                </div>

                <div class="auth-forms">
                    <!-- Login Form -->
                    <form id="login-form" class="auth-form active">
                        <div class="form-group">
                            <label>Benutzername oder E-Mail</label>
                            <input type="text" id="login-email" required placeholder="maxmuster / name@beispiel.de" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Passwort</label>
                            <input type="password" id="login-password" required placeholder="••••••••" class="form-control">
                        </div>
                        <div class="form-error" id="login-error"></div>
                        <button type="submit" class="btn btn-primary full-width">Einloggen <i class="ph-bold ph-arrow-right"></i></button>
                    </form>

                    <!-- Register Form -->
                    <form id="register-form" class="auth-form" style="display:none;">
                        <div class="form-group">
                            <label>Voller Name</label>
                            <input type="text" id="register-name" required placeholder="Dein Name" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>E-Mail Adresse</label>
                            <input type="email" id="register-email" required placeholder="name@beispiel.de" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Passwort (min. 8 Zeichen, inkl. Zahl & Sonderzeichen)</label>
                            <input type="password" id="register-password" required minlength="8" placeholder="••••••••" class="form-control">
                        </div>
                        <div class="form-error" id="register-error"></div>
                        <button type="submit" class="btn btn-success full-width">Account erstellen <i class="ph-bold ph-check"></i></button>
                    </form>
                </div>
                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="#privacy" class="nav-item" data-route="privacy" style="font-size: 0.85rem; color: var(--text-secondary); text-decoration: underline;">Datenschutzerklärung</a>
                </div>
            </div>
        </div>
    </template>
    
    <!-- Dashboard Template -->
    <template id="tpl-dashboard">
        <div class="view fade-in">
            <header class="view-header">
                <h1>Willkommen zurück! 👋</h1>
                <p>Setze dein Training fort und maximiere deinen Fortschritt.</p>
            </header>
            
            <div class="subject-grid" id="dashboard-subjects-container">
                <!-- Dynamically injected via app.js -->
            </div>
        </div>
    </template>

    <!-- Learning Area Template -->
    <template id="tpl-learning">
        <div class="view fade-in">
            <header class="view-header">
                <h1>Lern-Bereich</h1>
                <p>Wähle ein Fach, um die zugehörigen Lektionen zu sehen.</p>
            </header>
            <div class="learning-tabs" id="learning-tabs-container"></div>
            <div id="learning-content-container"></div>
        </div>
    </template>

    <!-- Profile Template -->
    <template id="tpl-profile">
        <div class="view fade-in">
            <header class="view-header">
                <h1>Mein Profil</h1>
                <p>Verwalte deine Daten (DSGVO-konform).</p>
            </header>
            
            <div class="content-card" style="max-width: 600px; margin-bottom: 2rem;">
                <h2>Profildaten bearbeiten</h2>
                <form id="profile-form" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="profile-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>E-Mail</label>
                        <input type="email" id="profile-email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Neues Passwort</label>
                        <input type="password" id="profile-password" class="form-control" placeholder="Leer lassen für keine Änderung">
                    </div>
                    <div class="form-group">
                        <label>Biografie / Info</label>
                        <textarea id="profile-bio" class="form-control" rows="3" placeholder="Erzähle etwas über dich..."></textarea>
                    </div>
                    <div class="form-error" id="profile-error"></div>
                    <button type="submit" class="btn btn-primary"><i class="ph ph-floppy-disk"></i> Speichern</button>
                </form>
            </div>

            <div class="content-card" style="max-width: 600px; border-color: rgba(239, 68, 68, 0.3);">
                <h2 style="color: var(--color-java);">Gefahrenzone</h2>
                <p>Hier kannst du deine Daten exportieren oder dein Konto löschen.</p>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button id="export-data-btn" class="btn btn-success"><i class="ph ph-download-simple"></i> JSON Export</button>
                    <button id="delete-account-btn" class="btn btn-danger"><i class="ph ph-trash"></i> Account löschen</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Admin Template -->
    <template id="tpl-admin">
        <div class="view fade-in">
            <header class="view-header">
                <h1>Admin-Bereich</h1>
                <p>Nutzer und Lerninhalte verwalten.</p>
            </header>

            <div class="learning-tabs" id="admin-tabs" style="margin-bottom: 2rem;">
                <button class="learning-tab active" data-target="admin-users">Nutzerverwaltung</button>
                <button class="learning-tab" data-target="admin-content">Inhalte (Lektionen)</button>
                <button class="learning-tab" data-target="admin-audit">Aktivitäten-Log</button>
            </div>
            
            <div id="admin-users" class="admin-panel active-panel content-card">
                <h2>Registrierte Nutzer</h2>
                <div style="overflow-x: auto; margin-top: 1.5rem;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>E-Mail</th>
                                <th>Rolle</th>
                                <th>Aktion</th>
                            </tr>
                        </thead>
                        <tbody id="admin-users-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div id="admin-content" class="admin-panel content-card" style="display:none;">
                <h2>Neue Lektion anlegen</h2>
                <form id="admin-lesson-form" style="margin-top: 1.5rem; max-width: 800px;">
                    <div class="form-group">
                        <label>Fach wählen</label>
                        <select id="admin-lesson-subject" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label>Titel der Lektion</label>
                        <input type="text" id="admin-lesson-title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Inhalt (HTML erlaubt)</label>
                        <textarea id="admin-lesson-content" class="form-control" rows="8" placeholder="<p>Dein Text hier...</p>" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="ph ph-plus-circle"></i> Lektion veröffentlichen</button>
                    <div id="admin-lesson-msg" style="margin-top: 1rem; font-weight: bold;"></div>
                </form>
            </div>

            <div id="admin-audit" class="admin-panel content-card" style="display:none;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <h2>Aktivitäten-Log</h2>
                    <select id="audit-user-filter" class="form-control" style="width: auto; min-width: 200px;">
                        <option value="">Alle Nutzer</option>
                    </select>
                </div>
                <div class="audit-timeline" id="audit-timeline">
                    <div class="loader"><i class="ph ph-spinner-gap ph-spin"></i> Lade Logs...</div>
                </div>
            </div>
        </div>
    </template>

    <!-- Privacy Template -->
    <template id="tpl-privacy">
        <div class="view fade-in">
            <header class="view-header">
                <h1>Datenschutzerklärung</h1>
                <p>Informationen zum Umgang mit deinen Daten.</p>
            </header>
            
            <div class="content-card" style="max-width: 800px; line-height: 1.6;">
                <h2>1. Verantwortlicher</h2>
                <p>Verantwortlich für den Betrieb dieser Webseite ist:<br>
                Sebastian Bade<br>
                Friedrich-Dürr-Str. 12, 68307 Mannheim<br>
                eztokk@gmail.com</p>

                <h2 style="margin-top: 1.5rem;">2. Erhebung und Speicherung von Daten</h2>
                <h3 style="margin-top: 1rem;">a) Server-Logfiles</h3>
                <p>Der Provider der Seiten erhebt und speichert automatisch Informationen in so genannten Server-Log-Dateien, die dein Browser automatisch übermittelt. Dies sind: Browsertyp/-version, Betriebssystem, Referrer URL, Uhrzeit der Serveranfrage und IP-Adresse. Diese Daten sind technisch erforderlich und werden nicht mit anderen Datenquellen zusammengeführt.</p>
                
                <h3 style="margin-top: 1rem;">b) Benutzerkonten & Lernfortschritt</h3>
                <p>Auf dieser Plattform legst du ein Nutzerkonto an, um deinen Lernfortschritt zu speichern. Dabei speichern wir deinen Namen, deine E-Mail-Adresse und ein verschlüsseltes Passwort. Wir verarbeiten diese Daten ausschließlich, um dir den Zugang zur Plattform zu ermöglichen und deinen individuellen Lern- und Quizfortschritt in unserer Datenbank zu sichern.</p>

                <h2 style="margin-top: 1.5rem;">3. Lokale Speicherung (LocalStorage) statt Cookies</h2>
                <p>Diese Webseite verwendet <strong>keine Tracking-Cookies</strong> (wie z.B. Google Analytics). Für die Funktionalität nutzen wir LocalStorage in deinem Browser. Dort speichern wir ausschließlich technisch notwendige Informationen:</p>
                <ul style="margin-left: 1.5rem; margin-bottom: 1rem;">
                    <li>Einen Sicherheits-Token (CSRF-Token) zum Schutz deines Logins.</li>
                    <li>Deine visuellen Einstellungen (z.B. Dark Mode).</li>
                </ul>

                <h2 style="margin-top: 1.5rem;">4. Deine Rechte</h2>
                <p>Du hast jederzeit das Recht auf unentgeltliche Auskunft über deine gespeicherten personenbezogenen Daten, deren Herkunft und Empfänger und den Zweck der Datenverarbeitung sowie ein Recht auf Berichtigung oder Löschung dieser Daten. Du kannst deine kompletten Daten in den Profileinstellungen herunterladen (JSON-Export) oder dein Konto dort jederzeit unwiderruflich löschen.</p>
                
                <div style="margin-top: 2rem;">
                    <button class="btn btn-primary nav-item" data-route="auth">Zurück zur Startseite</button>
                </div>
            </div>
        </div>
    </template>

    <!-- App Script -->
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
